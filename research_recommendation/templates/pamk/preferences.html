{% extends 'pamk/base.html' %}{% block content %}<section class="hero"><div class="eyebrow">YOUR TASTE</div><h1>我的电影偏好</h1><p>选择喜欢的电影类型，让冷启动推荐更贴近你的兴趣。</p></section><form method="post" class="panel">{% csrf_token %}<h2>你喜欢哪些类型？</h2><p class="muted">类型偏好用于业务元数据推荐，不会为账号分配其他研究用户的模型向量。真实电影正反馈可进一步用于PAMK兼容推荐。</p><div class="genre-options">{% for genre in genres %}<label><input type="checkbox" name="genres" value="{{ genre }}" {% if genre in selected %}checked{% endif %}> {{ genre }}</label>{% endfor %}</div><div class="actions" style="margin-top:24px"><button>保存偏好</button><a href="/depot/">去给电影评分 →</a></div></form>{% endblock %}
