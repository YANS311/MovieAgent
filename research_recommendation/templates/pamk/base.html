{% load static %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}MovieAgent · 电影推荐{% endblock %}</title><link rel="icon" href="{% static 'pamk/favicon.svg' %}" type="image/svg+xml"><link rel="stylesheet" href="{% static 'pamk/app.css' %}"><script defer src="{% static 'pamk/app.js' %}"></script></head><body><header class="topnav"><nav class="navinner" aria-label="主导航"><a class="brand" href="/">▥ MovieAgent<span>发现你的下一部好电影</span></a><button class="navtoggle" type="button" aria-expanded="false" aria-controls="main-nav">菜单 ☰</button><div id="main-nav" class="navlinks"><a href="/" {% if request.path == '/' %}class="active"{% endif %}>首页</a><a href="/rankings/" {% if request.path == '/rankings/' %}class="active"{% endif %}>排行榜</a><a href="/depot/" {% if request.path == '/depot/' %}class="active"{% endif %}>影片库</a><a href="/recommend/" {% if request.path == '/recommend/' %}class="active"{% endif %}>个性化推荐</a><a href="/assistant/" {% if request.path == '/assistant/' %}class="active"{% endif %}>推荐助手</a></div><div class="navuser">{% if user.is_authenticated %}<a href="/preferences/">我的偏好</a><span class="username" title="{{ user.username }}">{{ user.username }}</span><form action="/logout/" method="post">{% csrf_token %}<button>退出</button></form>{% else %}<a href="/login/">登录</a><a href="/register/">注册</a>{% endif %}</div></nav></header><main>{% block content %}{% endblock %}</main><footer class="footer"><span>MovieAgent · 电影发现与个性化推荐</span><span>来源可追溯 · 研究演示与业务账号独立</span></footer></body></html>
