<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电影推荐 · PAMK</title><style>body{margin:0;background:#f5f6fa;color:#18243a;font:16px/1.7 system-ui,sans-serif}nav{padding:18px 6%;background:#13243b;color:white;display:flex;gap:25px;align-items:center}nav a{color:white;text-decoration:none}main{max-width:1100px;margin:35px auto;padding:0 24px}article,.panel{background:white;border:1px solid #dde3ec;border-radius:10px;padding:22px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.grid article{margin:0}h1,h2{line-height:1.4}button{background:#176b75;color:white;border:0;border-radius:6px;padding:10px 19px;cursor:pointer}input,select{padding:9px;max-width:100%}.badge{background:#e3eef1;padding:4px 9px;border-radius:5px;font-size:13px}.muted{color:#5d6a7b;font-size:14px}.error{color:#a72e29}a{color:#125b80}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:inline-block;margin:7px}</style></head><body><nav><strong>电影推荐系统</strong><a href="/depot/">浏览电影</a><a href="/recommend/">为我推荐</a>{% if user.is_authenticated %}<a href="/preferences/">兴趣偏好</a><span>{{ user.username }}</span><form action="/logout/" method="post">{% csrf_token %}<button>退出</button></form>{% else %}<a href="/login/">登录</a><a href="/register/">注册</a>{% endif %}</nav><main>{% block content %}{% endblock %}</main></body></html>
