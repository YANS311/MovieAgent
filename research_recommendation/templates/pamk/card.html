{% load static %}<article class="movie-card"><a class="poster-link" href="/movie/{{ movie.pk }}/"><img src="{{ movie.display_poster|default:'/static/pamk/poster-placeholder.svg' }}" alt="{{ movie.title }}海报" loading="lazy" width="400" height="600" data-poster><span class="poster-score">★ {{ movie.score|default_if_none:'暂无' }}</span>{% if rank %}<span class="rank-number">{{ rank }}</span>{% endif %}</a><div class="card-body"><h3><a href="/movie/{{ movie.pk }}/">{{ movie.title }}</a></h3><div class="genres">{% for g in movie.genres.all|slice:':2' %}<span class="badge">{{ g.name }}</span>{% empty %}<span class="muted">类型暂缺</span>{% endfor %}</div><p class="card-summary">{{ movie.summary|default:'暂无可信简介'|truncatechars:70 }}</p><div class="card-bottom"><span class="muted">{{ movie.date|date:'Y'|default:'年份暂缺' }}</span><a href="/movie/{{ movie.pk }}/">查看详情 →</a></div></div></article>
