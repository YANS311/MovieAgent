{% extends 'pamk/base.html' %}{% block content %}<h1>为我推荐</h1><p>系统依据账号可用输入选择推荐来源，并显示模型身份。研究授权仅允许受控科研演示，不证明账号与研究用户为同一人。</p><form id="recommend-form" class="panel">{% csrf_token %}<label>推荐数量 <input name="top_k" type="number" value="10" min="1" max="100"></label>{% if grants %}<label>已授权研究画像 <select name="profile_id"><option value="">自动选择</option>{% for g in grants %}<option value="{{ g.profile_id }}">{{ g.profile.display_name }}</option>{% endfor %}</select></label>{% endif %}<button>生成推荐</button></form><p id="status" role="status">点击生成推荐</p><div id="items" class="grid"></div><script>
const form=document.getElementById('recommend-form'), status=document.getElementById('status'), items=document.getElementById('items');
form.addEventListener('submit',async e=>{e.preventDefault();items.replaceChildren();status.textContent='正在计算，请等待模型加载…';const data={top_k:Number(form.elements.top_k.value)};if(form.elements.profile_id?.value)data.profile_id=form.elements.profile_id.value;
try{const response=await fetch('/api/recommendations/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':form.elements.csrfmiddlewaretoken.value},body:JSON.stringify(data)});const r=await response.json();if(!response.ok)throw Error(r.error);
status.textContent='来源：'+r.source+' · '+(r.model_name||'业务元数据推荐')+(r.encoding_method?' · 用户编码 '+r.encoding_method:'')+' · Trace '+r.trace_id+(r.cache_status==='HIT'?' · 缓存结果，本次未调用GPU':(r.worker?' · GPU评分 '+r.worker.score_seconds.toFixed(3)+'秒':''));
for(const x of r.recommendations){const article=document.createElement('article');const title=document.createElement('h2');title.textContent=x.rank+'. '+x.movie_title;article.append(title);const label=document.createElement('p');label.className='badge';label.textContent=x.mapping_status;article.append(label);const score=document.createElement('p');score.textContent='排序分数：'+Number(x.score).toFixed(6)+(x.canonical_movie_id!==null?' · 规范ID '+x.canonical_movie_id:'');article.append(score);const a=document.createElement('a');a.href=x.detail_url||x.research_detail_url;a.textContent=x.detail_url?'查看业务电影':'查看研究元数据';article.append(a);items.append(article);}
}catch(error){status.textContent='推荐暂不可用：'+error.message;status.className='error';}});
</script>{% endblock %}
