{% extends 'pamk/base.html' %}{% block content %}<section class="hero"><div class="eyebrow">FOR YOU / 个性化推荐</div><h1>发现更合你心意的电影</h1><p>从真实观影历史出发，保留每一次推荐的来源与记录。</p></section><form id="recommend-form" class="panel">{% csrf_token %}<div class="recommend-controls"><label>推荐数量 <input name="top_k" type="number" value="12" min="1" max="100"></label>{% if grants %}<label>已授权研究画像 <select name="profile_id"><option value="">自动选择</option>{% for g in grants %}<option value="{{ g.profile_id }}">{{ g.profile.display_name }}</option>{% endfor %}</select></label>{% endif %}<button>生成推荐</button><a href="/preferences/">调整兴趣偏好</a><a href="/depot/">添加电影评分 →</a></div><p class="mode-note">普通账号依据自身真实历史选择PAMK兼容排序或冷启动；研究授权仅用于受控演示，不证明账号与研究用户为同一人。</p></form><section id="status" class="panel status-panel" role="status" aria-live="polite">点击生成推荐，查看本次推荐来源。</section><div id="items" class="movie-grid recommend-grid"><div class="empty"><h2>下一部好电影，从这里开始</h2><p>评分或收藏你喜欢的电影，再生成推荐。</p></div></div><script defer src="/static/pamk/recommend.js"></script>{% endblock %}
